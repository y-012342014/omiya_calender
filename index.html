<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>ライブ予定</title>
<meta name="description" content="大宮I☆DOLL・HyperMelty の公演を公演日順に">
<style>
:root {
  --bg: #f6f5f8; --card: #ffffff; --text: #1d1b22; --sub: #6b6774; --line: #e4e1ea;
  --accent: #d6336c; --accent-weak: #fbe4ec; --ok: #2b8a3e; --muted-bg: #efedf3; --btn: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131217; --card: #1e1c24; --text: #ecebf0; --sub: #a29eae; --line: #312e3a;
    --accent: #f06595; --accent-weak: #3a1e2a; --ok: #69db7c; --muted-bg: #27252e; --btn: #26242c;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  font-size: 15px; line-height: 1.5; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  padding: 10px 16px 0; padding-top: max(10px, env(safe-area-inset-top)); }
h1 { font-size: 17px; margin: 0; }
.meta { font-size: 12px; color: var(--sub); margin: 2px 0 6px; }
.accts { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 0 4px; }
.accts button { border: 1px solid var(--line); background: var(--btn); color: var(--sub); border-radius: 14px;
  padding: 3px 11px; font-size: 13px; white-space: nowrap; cursor: pointer; }
.accts button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
nav { display: flex; gap: 4px; }
nav button { border: 0; background: none; color: var(--sub); padding: 8px 10px; font-size: 14px;
  border-bottom: 2px solid transparent; cursor: pointer; }
nav button.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
main { max-width: 860px; margin: 0 auto; padding: 12px 16px 60px; }
.month { font-size: 13px; color: var(--sub); margin: 18px 2px 6px; font-weight: 600; }
.card { display: flex; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px; margin-bottom: 8px; cursor: pointer; }
.card.canceled { opacity: .55; }
.date { flex: 0 0 52px; text-align: center; }
.date .md { font-size: 20px; font-weight: 700; line-height: 1.1; }
.date .wd { font-size: 12px; color: var(--sub); }
.date .wd.sat { color: #3b82f6; } .date .wd.sun { color: #e03131; }
.body { flex: 1; min-width: 0; }
.who { font-size: 11px; color: var(--accent); font-weight: 600; }
.title { font-weight: 600; overflow-wrap: anywhere; }
.line2 { font-size: 13px; color: var(--sub); overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; align-items: center; }
.chip { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--muted-bg); color: var(--sub); }
.chip.ev { background: #e7f5ff; color: #1971c2; }
.chip.on { background: #ebfbee; color: var(--ok); }
.chip.cancel { background: var(--accent-weak); color: var(--accent); }
@media (prefers-color-scheme: dark) { .chip.ev { background: #172a3a; color: #74c0fc; } .chip.on { background: #16301d; } }
.thumb { flex: 0 0 64px; width: 64px; height: 64px; border-radius: 8px; object-fit: cover; background: var(--muted-bg); }
a.ticket, a.btn { display: inline-block; font-size: 13px; padding: 4px 12px; border-radius: 14px; background: var(--accent);
  color: #fff; text-decoration: none; font-weight: 600; }
a.btn.sub { background: var(--muted-bg); color: var(--text); font-weight: 400; }
.card a.ticket { font-size: 12px; padding: 3px 10px; }
.empty { text-align: center; color: var(--sub); padding: 40px 0; }
.monthbar { display: flex; align-items: center; gap: 8px; margin: 4px 0 8px; }
.monthbar button { border: 1px solid var(--line); background: var(--btn); color: var(--text); border-radius: 8px;
  width: 38px; height: 34px; font-size: 16px; cursor: pointer; }
.monthbar button:disabled { opacity: .35; cursor: default; }
.monthbar select { flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--card);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.cals { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-top: 24px;
  font-size: 13px; }
.cals h2 { font-size: 14px; margin: 0 0 6px; }
.cals .row { margin: 6px 0; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
dialog { border: 0; padding: 0; width: min(640px, 100vw); max-width: 100vw; max-height: 92vh; border-radius: 14px;
  background: var(--card); color: var(--text); }
dialog::backdrop { background: rgba(0,0,0,.45); }
@media (max-width: 600px) { dialog { margin: auto 0 0; border-radius: 14px 14px 0 0; max-height: 94vh; } }
.dlg-head { position: sticky; top: 0; background: var(--card); padding: 12px 16px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 8px; }
.dlg-head h3 { margin: 0; font-size: 16px; flex: 1; overflow-wrap: anywhere; }
.dlg-head button { border: 1px solid var(--line); background: var(--btn); color: var(--text); border-radius: 8px;
  padding: 6px 12px; font-size: 14px; cursor: pointer; }
.dlg-body { padding: 12px 16px 24px; }
.dlg-body dl { display: grid; grid-template-columns: 5em 1fr; gap: 4px 8px; margin: 0 0 12px; }
.dlg-body dt { color: var(--sub); font-size: 13px; }
.dlg-body dd { margin: 0; overflow-wrap: anywhere; }
.dlg-body img { max-width: 100%; border-radius: 8px; margin-top: 10px; }
.small { font-size: 12px; color: var(--sub); }
button.went { border: 1px solid var(--line); background: var(--btn); color: var(--sub); border-radius: 14px;
  padding: 2px 10px; font-size: 12px; cursor: pointer; }
button.went.on { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 600; }
@media (prefers-color-scheme: dark) { button.went.on { color: #10210f; } }
.card.went-on { border-color: var(--ok); }
.chip.also { background: #fff3bf; color: #8a5a00; }
@media (prefers-color-scheme: dark) { .chip.also { background: #3a3014; color: #ffd43b; } }
.memo-line { font-size: 13px; color: var(--text); margin-top: 4px; overflow-wrap: anywhere; }
.dlg-body textarea { width: 100%; min-height: 90px; font: inherit; color: var(--text); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.alsobox { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; }
.alsobox .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
.panel h2 { font-size: 14px; margin: 0 0 8px; }
.stat-big { font-size: 28px; font-weight: 700; line-height: 1.1; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px 12px; margin-top: 8px; font-size: 13px; }
.stat-grid b { font-size: 16px; }
.panel textarea { width: 100%; min-height: 64px; font: 12px/1.4 ui-monospace, Consolas, monospace; color: var(--text);
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; overflow-wrap: anywhere; }
.panel .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.panel .row button { border: 1px solid var(--line); background: var(--btn); color: var(--text); border-radius: 8px;
  padding: 6px 12px; font-size: 13px; cursor: pointer; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg);
  padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 20; display: none; max-width: 90vw; }
</style>
</head>
<body>
<header>
  <h1>ライブ予定</h1>
  <div class="meta" id="meta">読み込み中…</div>
  <div class="accts" id="accts"></div>
  <nav>
    <button data-tab="upcoming" class="on">今後</button>
    <button data-tab="past">終了</button>
    <button data-tab="went">行った</button>
  </nav>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>
<dialog id="dlg"><div class="dlg-head"><h3 id="dlgTitle"></h3><button id="dlgClose">閉じる</button></div>
  <div class="dlg-body" id="dlgBody"></div></dialog>

<script>
// 見るだけ版（GitHub Pages）。data.json は手元のアプリが1日数回書き出している
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const WD = ["日","月","火","水","木","金","土"];
const store = { get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
let DATA = { accounts: [], shows: [] }, TAB = "upcoming", ACCT = store.get("acct"), PAST_YM = "";

let WENT = new Set(), MEMO = {}, KEYIDX = {}, CUR_I = null;
const toast = (msg) => { const t = $("toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 2500); };

// 引き継ぎコード: 「LV1 グループ:日付,日付…;グループ:…」。日付は YYMMDD、同じ日の2本目以降は -2 など
function encodeWent(set) {
  const by = {};
  [...set].sort().forEach(k => { const [a, d, n] = k.split("|"); (by[a] = by[a] || []).push(d.replaceAll("-", "").slice(2) + (n ? "-" + n : "")); });
  return "LV1 " + Object.keys(by).sort().map(a => `${a}:${by[a].join(",")}`).join(";");
}
function decodeWent(code) {
  const out = new Set();
  const body = String(code || "").trim().replace(/^LV1\s*/, "");
  if (!body) return out;
  for (const part of body.split(";")) {
    const [a, list] = part.split(":");
    if (!a || !list || !/^[A-Za-z0-9_]+$/.test(a.trim())) throw new Error("コードの形が正しくありません");
    for (const item of list.split(",")) {
      const m = item.trim().match(/^(\d{2})(\d{2})(\d{2})(?:-(\d+))?$/);
      if (!m) throw new Error("コードの形が正しくありません: " + item);
      out.add(`${a.trim()}|20${m[1]}-${m[2]}-${m[3]}` + (m[4] ? `|${m[4]}` : ""));
    }
  }
  return out;
}
// メモがあるときの引き継ぎコードは「LV2 」＋（チェックとメモを JSON にして base64url にしたもの）
const b64e = (str) => btoa(String.fromCharCode(...new TextEncoder().encode(str))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const b64d = (b) => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0)));
function encodeAll() {
  const went = encodeWent(WENT);
  const memo = Object.fromEntries(Object.entries(MEMO).filter(([, v]) => v && v.trim()));
  return Object.keys(memo).length ? "LV2 " + b64e(JSON.stringify({ w: went.replace(/^LV1 /, ""), m: memo })) : went;
}
function decodeAll(code) {
  code = String(code || "").trim();
  if (code.startsWith("LV2")) {
    let o;
    try { o = JSON.parse(b64d(code.replace(/^LV2\s*/, ""))); } catch (e) { throw new Error("コードの形が正しくありません"); }
    return { went: decodeWent("LV1 " + (o.w || "")), memo: o.m || {} };
  }
  return { went: decodeWent(code), memo: {} };
}
const idb = {
  open() { return new Promise((res, rej) => { const r = indexedDB.open("live-went", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k = "went") { try { const db = await this.open(); return await new Promise(res => {
    const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result || ""); q.onerror = () => res(""); }); } catch (e) { return ""; } },
  async set(v, k = "went") { try { const db = await this.open(); db.transaction("kv", "readwrite").objectStore("kv").put(v, k); } catch (e) {} },
};
async function loadWent() {
  const merged = new Set();
  for (const src of [store.get("went"), await idb.get()]) {
    try { decodeWent(src).forEach(k => merged.add(k)); } catch (e) {}
  }
  WENT = merged;
  const memo = {};
  for (const src of [await idb.get("memo"), store.get("memo")]) {   // 後に読むほう（localStorage）を優先
    try { Object.assign(memo, JSON.parse(src || "{}")); } catch (e) {}
  }
  MEMO = memo;
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
}
function refreshCode() {
  const ta = $("wentCode");
  if (ta) ta.value = encodeAll();   // 引き継ぎコードは常に最新
}
function saveWent() {
  const code = encodeWent(WENT);
  store.set("went", code);
  idb.set(code);
  refreshCode();
}
function saveMemo() {
  const v = JSON.stringify(MEMO);
  store.set("memo", v);
  idb.set(v, "memo");
  refreshCode();
}

const today = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; })();
const labelOf = (id) => (DATA.accounts.find(a => a.id === id) || {}).label || id;
function dparts(iso) { const [y, m, d] = iso.split("-").map(Number); return { y, m, d, w: new Date(y, m - 1, d).getDay() }; }

function chips(s) {
  const c = [];
  if (s.status === "canceled") c.push('<span class="chip cancel">中止</span>');
  if (s.type === "event") c.push('<span class="chip ev">イベント</span>');
  if (s.sale === "on" && s.date >= today) c.push('<span class="chip on">予約受付中</span>');
  if (s.sale === "before" && s.date >= today && (!s.sale_start || s.sale_start > today)) c.push(`<span class="chip">発売前${s.sale_start ? " " + s.sale_start.slice(5).replace("-", "/") + "〜" : ""}</span>`);
  if (s.sale === "soldout") c.push('<span class="chip">完売</span>');
  return c.join("");
}
function alsoChips(s) {
  return (s.also || []).map(a => {
    const o = DATA.shows[KEYIDX[a.key]];
    if (!o) return "";
    return a.how === "same" ? `<span class="chip also">＋${esc(labelOf(o.account))} も出演</span>`
                            : `<span class="chip">同じ会場に ${esc(labelOf(o.account))}</span>`;
  }).join("");
}
const times = (s) => [s.open && "開場 " + s.open, s.start && "開演 " + s.start, s.stage && "出演 " + s.stage].filter(Boolean).join("　");

function card(s, i) {
  const p = dparts(s.date);
  const ticket = s.tickets[0] && s.date >= today ? `<a class="ticket" href="${esc(s.tickets[0])}" target="_blank" rel="noopener" onclick="event.stopPropagation()">チケット</a>` : "";
  const on = WENT.has(s.key);
  const went = s.date <= today && s.key ? `<button class="went ${on ? "on" : ""}" data-went="${esc(s.key)}">${on ? "✓ 行った" : "行った？"}</button>` : "";
  return `<div class="card ${s.status === "canceled" ? "canceled" : ""} ${on ? "went-on" : ""}" data-i="${i}">
    <div class="date"><div class="md">${p.m}/${p.d}</div><div class="wd ${p.w === 6 ? "sat" : p.w === 0 ? "sun" : ""}">${WD[p.w]}${p.y !== new Date().getFullYear() ? "<br>" + p.y : ""}</div></div>
    <div class="body">${ACCT ? "" : `<div class="who">${esc(labelOf(s.account))}</div>`}
      <div class="title">${esc(s.title || (s.type === "event" ? "イベント" : "ライブ"))}</div>
      ${s.venue ? `<div class="line2">📍${esc(s.venue)}</div>` : ""}
      ${times(s) ? `<div class="line2">${esc(times(s))}</div>` : ""}
      ${MEMO[s.key] ? `<div class="memo-line">📝 ${esc(MEMO[s.key].split("\n")[0].slice(0, 40))}${MEMO[s.key].length > 40 || MEMO[s.key].includes("\n") ? "…" : ""}</div>` : ""}
      <div class="chips">${went}${ticket}${chips(s)}${alsoChips(s)}</div></div>
    ${s.thumb ? `<img class="thumb" loading="lazy" src="${esc(s.thumb)}" alt="">` : ""}
  </div>`;
}

function render() {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === TAB));
  const accts = DATA.accounts;
  $("accts").hidden = accts.length < 2;
  $("accts").innerHTML = [`<button data-acct="" class="${ACCT ? "" : "on"}">すべて</button>`]
    .concat(accts.map(a => `<button data-acct="${esc(a.id)}" class="${ACCT === a.id ? "on" : ""}">${esc(a.label)}</button>`)).join("");
  let list = DATA.shows.map((s, i) => ({ s, i })).filter(x => !ACCT || x.s.account === ACCT);
  if (TAB === "went") { $("main").innerHTML = renderWent(list); return; }
  list = TAB === "upcoming" ? list.filter(x => x.s.date >= today) : list.filter(x => x.s.date < today).reverse();
  let html = "", cur = "";
  if (TAB === "past" && list.length) {
    // 終了した公演は量が多いので、1か月ずつ表示する（新しい月から）
    const months = [...new Set(list.map(x => x.s.date.slice(0, 7)))];
    const counts = {};
    list.forEach(x => { const k = x.s.date.slice(0, 7); counts[k] = (counts[k] || 0) + 1; });
    if (!months.includes(PAST_YM)) PAST_YM = months[0];
    const k = months.indexOf(PAST_YM);
    const label = (ym) => { const [y, m] = ym.split("-"); return `${y}年${Number(m)}月（${counts[ym]}件）`; };
    html += `<div class="monthbar">
      <button data-ym="${months[k + 1] || ""}" ${months[k + 1] ? "" : "disabled"} aria-label="前の月">‹</button>
      <select id="ymSel" aria-label="表示する月">${months.map(m => `<option value="${m}" ${m === PAST_YM ? "selected" : ""}>${label(m)}</option>`).join("")}</select>
      <button data-ym="${months[k - 1] || ""}" ${k > 0 ? "" : "disabled"} aria-label="次の月">›</button></div>`;
    list = list.filter(x => x.s.date.slice(0, 7) === PAST_YM);
  }
  for (const { s, i } of list) {
    const ym = s.date.slice(0, 7);
    if (ym !== cur) { cur = ym; const [y, m] = ym.split("-"); html += `<div class="month">${y}年${Number(m)}月</div>`; }
    html += card(s, i);
  }
  if (!list.length) html = `<div class="empty">${TAB === "upcoming" ? "今後の公演はまだありません" : "ありません"}</div>`;
  const cals = accts.filter(a => (!ACCT || a.id === ACCT) && a.calendar && a.calendar.web);
  if (cals.length) {
    html += `<div class="cals"><h2>カレンダーに入れる</h2>${cals.map(a => `<div class="row"><b>${esc(a.label)}</b>
      <a class="btn sub" href="${esc(a.calendar.add)}" target="_blank" rel="noopener">Google カレンダーに追加</a>
      <a class="btn sub" href="${esc(a.calendar.web)}" target="_blank" rel="noopener">カレンダーで見る</a>
      <a class="btn sub" href="${esc(a.calendar.ical)}">iCal（iPhone など）</a></div>`).join("")}
      <div class="small">TimeTree を使っている人は、Google カレンダー（または iPhone のカレンダー）に追加してから、TimeTree アプリで外部カレンダーの表示をオンにしてください。</div></div>`;
  }
  $("main").innerHTML = html;
}

function renderWent(all) {
  const mine = all.filter(x => WENT.has(x.s.key)).reverse();
  const byYear = {}, byGroup = {};
  mine.forEach(({ s }) => { const y = s.date.slice(0, 4); byYear[y] = (byYear[y] || 0) + 1; byGroup[s.account] = (byGroup[s.account] || 0) + 1; });
  const thisYear = String(new Date().getFullYear());
  let html = `<div class="panel"><h2>行ったライブ${ACCT ? `（${esc(labelOf(ACCT))}）` : ""}</h2>
    <div class="stat-big">${mine.length}<span class="small"> 回</span></div>
    <div class="stat-grid">
      ${Object.keys(byYear).sort().reverse().map(y => `<div>${y}年 <b>${byYear[y]}</b> 回${y === thisYear ? "（今年）" : ""}</div>`).join("")}
      ${ACCT ? "" : Object.keys(byGroup).map(a => `<div>${esc(labelOf(a))} <b>${byGroup[a]}</b> 回</div>`).join("")}
    </div>
    <div class="small" style="margin-top:6px">公演の「行った？」を押すと数えます。公演を開くとメモも残せます（チェックもメモもこの端末のブラウザにだけ保存され、ほかの人には見えません）。</div></div>`;
  let cur = "";
  for (const { s, i } of mine) {
    const ym = s.date.slice(0, 7);
    if (ym !== cur) { cur = ym; const [y, m] = ym.split("-"); html += `<div class="month">${y}年${Number(m)}月</div>`; }
    html += card(s, i);
  }
  if (!mine.length) html += `<div class="empty">まだありません。「終了」タブの公演で「行った？」を押してください。</div>`;
  const known = new Set(DATA.shows.map(s => s.key));
  const lost = [...WENT].filter(k => !known.has(k)).length;
  html += `<div class="panel" style="margin-top:18px"><h2>引き継ぎコード</h2>
    <div class="small">機種変更やブラウザのデータ消去に備えて、ときどきコピーしてメモや LINE に残してください。チェックするたびに自動で最新になります。</div>
    <textarea id="wentCode" readonly>${esc(encodeAll())}</textarea>
    <div class="row"><button id="wentCopy">コピー</button>${navigator.share ? '<button id="wentShare">共有（LINE・メモなど）</button>' : ""}</div>
    <div class="small" style="margin-top:10px">新しい端末では、残しておいたコードを貼り付けて「復元」を押します（今のチェックに足し合わせます）。</div>
    <textarea id="wentIn" placeholder="LV1 idoll_omiya:251127,…"></textarea>
    <div class="row"><button id="wentRestore">復元</button></div>
    ${lost ? `<div class="small">一覧にない公演のチェックが ${lost} 件あります（公演の情報が直されたためです。コードには残しています）。</div>` : ""}
    <div class="small">iPhone の Safari は、しばらく開かないサイトのデータを消すことがあります。ホーム画面に追加して使うと消えにくくなります。</div></div>`;
  return html;
}

function openShow(i) {
  CUR_I = i;
  const s = DATA.shows[i];
  const p = dparts(s.date);
  $("dlgTitle").textContent = `${p.m}/${p.d}（${WD[p.w]}） ${s.title || ""}`;
  const rows = [["グループ", labelOf(s.account)], ["公演名", s.title], ["会場", s.venue], ["開場", s.open], ["開演", s.start], ["出演", s.stage],
    ["状態", s.status === "canceled" ? "中止" : ""]].filter(r => r[1]);
  $("dlgBody").innerHTML = `<dl>${rows.map(r => `<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl>
    <div class="chips">${s.tickets.map((u, k) => `<a class="ticket" href="${esc(u)}" target="_blank" rel="noopener">チケット${s.tickets.length > 1 ? k + 1 : ""}</a>`).join("")}
      ${s.post ? `<a class="btn sub" href="${esc(s.post)}" target="_blank" rel="noopener">元の告知（X）</a>` : ""}</div>
    ${s.date <= today ? `<p><button class="went ${WENT.has(s.key) ? "on" : ""}" data-went="${esc(s.key)}">${WENT.has(s.key) ? "✓ 行った" : "行った？"}</button></p>` : ""}
    ${alsoBox(s)}
    <div class="alsobox"><div class="small">メモ（この端末のブラウザにだけ保存。引き継ぎコードにも入ります）</div>
      <textarea id="memoIn" data-key="${esc(s.key)}" placeholder="セトリ、特典会、誰と行ったか など">${esc(MEMO[s.key] || "")}</textarea></div>
    <p class="small">告知から自動で読み取っています。時間や内容は元の告知で確かめてください。</p>
    ${s.image ? `<a href="${esc(s.post || s.image)}" target="_blank" rel="noopener"><img src="${esc(s.image)}" alt=""></a>` : ""}`;
  if (!$("dlg").open) $("dlg").showModal();   // 開いたまま別の公演に切り替えることもある
  $("dlg").scrollTop = 0;
}

function alsoBox(s) {
  if (!s.also || !s.also.length) return "";
  return `<div class="alsobox">${s.also.map(a => {
    const o = DATA.shows[KEYIDX[a.key]];
    if (!o) return "";
    const on = WENT.has(o.key);
    const head = a.how === "same" ? `${esc(labelOf(o.account))} も出演しています` : `同じ日・同じ会場に ${esc(labelOf(o.account))} の公演があります`;
    return `<div class="small">${head}</div><div class="row"><a href="#" data-open="${KEYIDX[a.key]}">${esc(o.title || "（公演名なし）")}${o.stage ? "　出演 " + esc(o.stage) : ""}</a>
      ${o.date <= today ? `<button class="went ${on ? "on" : ""}" data-went="${esc(o.key)}">${on ? "✓ 行った" : "行った？"}</button>` : ""}</div>`;
  }).join("")}</div>`;
}

let memoTimer = null;
document.addEventListener("input", (ev) => {
  if (ev.target.id !== "memoIn") return;
  const k = ev.target.dataset.key, v = ev.target.value;
  clearTimeout(memoTimer);
  memoTimer = setTimeout(() => {   // 打つたびに自動で保存
    if (v.trim()) MEMO[k] = v; else delete MEMO[k];
    saveMemo();
  }, 400);
});

document.addEventListener("click", async (ev) => {
  const op = ev.target.closest("[data-open]");
  if (op) { ev.preventDefault(); openShow(Number(op.dataset.open)); return; }
  const w = ev.target.closest("[data-went]");
  if (w) {
    ev.stopPropagation();
    const k = w.dataset.went;
    if (WENT.has(k)) WENT.delete(k); else WENT.add(k);
    saveWent();
    render();
    if ($("dlg").open && CUR_I !== null) openShow(CUR_I);
    return;
  }
  if (ev.target.id === "wentCopy") {
    const code = encodeAll();
    try { await navigator.clipboard.writeText(code); toast("コピーしました"); }
    catch (e) { const ta = $("wentCode"); ta.select(); document.execCommand("copy"); toast("コピーしました"); }
    return;
  }
  if (ev.target.id === "wentShare") {
    try { await navigator.share({ title: "ライブ予定 引き継ぎコード", text: encodeAll() }); } catch (e) {}
    return;
  }
  if (ev.target.id === "wentRestore") {
    try {
      const got = decodeAll($("wentIn").value);
      if (!got.went.size && !Object.keys(got.memo).length) { toast("コードを貼り付けてください"); return; }
      const before = WENT.size;
      got.went.forEach(k => WENT.add(k));
      let memos = 0;
      for (const [k, v] of Object.entries(got.memo)) if (!MEMO[k]) { MEMO[k] = v; memos++; }
      saveWent(); saveMemo(); render();
      toast(`復元しました（チェック ${WENT.size - before} 件・メモ ${memos} 件を追加）`);
    } catch (e) { toast(e.message); }
    return;
  }
  const ym = ev.target.closest("[data-ym]");
  if (ym && ym.dataset.ym) { PAST_YM = ym.dataset.ym; render(); window.scrollTo(0, 0); return; }
  const t = ev.target.closest("[data-tab],[data-acct],[data-i]");
  if (!t) return;
  if (t.dataset.tab) { TAB = t.dataset.tab; render(); window.scrollTo(0, 0); }
  else if (t.dataset.acct !== undefined) { ACCT = t.dataset.acct; store.set("acct", ACCT); render(); }
  else if (t.dataset.i !== undefined) openShow(Number(t.dataset.i));
});
document.addEventListener("change", (ev) => {
  if (ev.target.id === "ymSel") { PAST_YM = ev.target.value; render(); window.scrollTo(0, 0); }
});
$("dlg").addEventListener("close", () => {
  const m = $("memoIn");
  if (m) { clearTimeout(memoTimer); if (m.value.trim()) MEMO[m.dataset.key] = m.value; else delete MEMO[m.dataset.key]; saveMemo(); }
  CUR_I = null;
  render();
});
$("dlgClose").onclick = () => $("dlg").close();
$("dlg").addEventListener("click", (ev) => { if (ev.target === $("dlg")) $("dlg").close(); });

Promise.all([fetch("data.json", { cache: "no-store" }).then(r => r.json()), loadWent()]).then(([d]) => {
  DATA = d;
  KEYIDX = Object.fromEntries(DATA.shows.map((s, i) => [s.key, i]));
  if (ACCT && !DATA.accounts.some(a => a.id === ACCT)) ACCT = "";
  const up = DATA.shows.filter(s => s.date >= today).length;
  $("meta").textContent = `今後 ${up}件・更新 ${(d.updated || "").slice(5, 16).replace("T", " ").replace("-", "/")}`;
  render();
}).catch(e => { $("main").innerHTML = `<div class="empty">読み込めませんでした（${esc(e.message)}）</div>`; });
</script>
</body>
</html>
