<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>ライブ予定</title>
<meta name="description" content="大宮I☆DOLL・HyperMelty の公演を公演日順に">
<style>
:root {
  --bg: #f6f5f8; --card: #ffffff; --text: #1d1b22; --sub: #6b6774; --line: #e4e1ea;
  --accent: #d6336c; --accent-weak: #fbe4ec; --ok: #2b8a3e; --muted-bg: #efedf3; --btn: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131217; --card: #1e1c24; --text: #ecebf0; --sub: #a29eae; --line: #312e3a;
    --accent: #f06595; --accent-weak: #3a1e2a; --ok: #69db7c; --muted-bg: #27252e; --btn: #26242c;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  font-size: 15px; line-height: 1.5; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  padding: 10px 16px 0; padding-top: max(10px, env(safe-area-inset-top)); }
h1 { font-size: 17px; margin: 0; }
.meta { font-size: 12px; color: var(--sub); margin: 2px 0 6px; }
.accts { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 0 4px; }
.accts button { border: 1px solid var(--line); background: var(--btn); color: var(--sub); border-radius: 14px;
  padding: 3px 11px; font-size: 13px; white-space: nowrap; cursor: pointer; }
.accts button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
nav { display: flex; gap: 4px; }
nav button { border: 0; background: none; color: var(--sub); padding: 8px 10px; font-size: 14px;
  border-bottom: 2px solid transparent; cursor: pointer; }
nav button.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
main { max-width: 860px; margin: 0 auto; padding: 12px 16px 60px; }
.month { font-size: 13px; color: var(--sub); margin: 18px 2px 6px; font-weight: 600; }
.card { display: flex; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px; margin-bottom: 8px; cursor: pointer; }
.card.canceled { opacity: .55; }
.date { flex: 0 0 52px; text-align: center; }
.date .md { font-size: 20px; font-weight: 700; line-height: 1.1; }
.date .wd { font-size: 12px; color: var(--sub); }
.date .wd.sat { color: #3b82f6; } .date .wd.sun { color: #e03131; }
.body { flex: 1; min-width: 0; }
.who { font-size: 11px; color: var(--accent); font-weight: 600; }
.title { font-weight: 600; overflow-wrap: anywhere; }
.line2 { font-size: 13px; color: var(--sub); overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; align-items: center; }
.chip { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--muted-bg); color: var(--sub); }
.chip.ev { background: #e7f5ff; color: #1971c2; }
.chip.on { background: #ebfbee; color: var(--ok); }
.chip.cancel { background: var(--accent-weak); color: var(--accent); }
@media (prefers-color-scheme: dark) { .chip.ev { background: #172a3a; color: #74c0fc; } .chip.on { background: #16301d; } }
.thumb { flex: 0 0 64px; width: 64px; height: 64px; border-radius: 8px; object-fit: cover; background: var(--muted-bg); }
a.ticket, a.btn { display: inline-block; font-size: 13px; padding: 4px 12px; border-radius: 14px; background: var(--accent);
  color: #fff; text-decoration: none; font-weight: 600; }
a.btn.sub { background: var(--muted-bg); color: var(--text); font-weight: 400; }
.card a.ticket { font-size: 12px; padding: 3px 10px; }
.empty { text-align: center; color: var(--sub); padding: 40px 0; }
.monthbar { display: flex; align-items: center; gap: 8px; margin: 4px 0 8px; }
.monthbar button { border: 1px solid var(--line); background: var(--btn); color: var(--text); border-radius: 8px;
  width: 38px; height: 34px; font-size: 16px; cursor: pointer; }
.monthbar button:disabled { opacity: .35; cursor: default; }
.monthbar select { flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--card);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.cals { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-top: 24px;
  font-size: 13px; }
.cals h2 { font-size: 14px; margin: 0 0 6px; }
.cals .row { margin: 6px 0; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
dialog { border: 0; padding: 0; width: min(640px, 100vw); max-width: 100vw; max-height: 92vh; border-radius: 14px;
  background: var(--card); color: var(--text); }
dialog::backdrop { background: rgba(0,0,0,.45); }
@media (max-width: 600px) { dialog { margin: auto 0 0; border-radius: 14px 14px 0 0; max-height: 94vh; } }
.dlg-head { position: sticky; top: 0; background: var(--card); padding: 12px 16px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 8px; }
.dlg-head h3 { margin: 0; font-size: 16px; flex: 1; overflow-wrap: anywhere; }
.dlg-head button { border: 1px solid var(--line); background: var(--btn); color: var(--text); border-radius: 8px;
  padding: 6px 12px; font-size: 14px; cursor: pointer; }
.dlg-body { padding: 12px 16px 24px; }
.dlg-body dl { display: grid; grid-template-columns: 5em 1fr; gap: 4px 8px; margin: 0 0 12px; }
.dlg-body dt { color: var(--sub); font-size: 13px; }
.dlg-body dd { margin: 0; overflow-wrap: anywhere; }
.dlg-body img { max-width: 100%; border-radius: 8px; margin-top: 10px; }
.small { font-size: 12px; color: var(--sub); }
</style>
</head>
<body>
<header>
  <h1>ライブ予定</h1>
  <div class="meta" id="meta">読み込み中…</div>
  <div class="accts" id="accts"></div>
  <nav>
    <button data-tab="upcoming" class="on">今後</button>
    <button data-tab="past">終了</button>
  </nav>
</header>
<main id="main"></main>
<dialog id="dlg"><div class="dlg-head"><h3 id="dlgTitle"></h3><button id="dlgClose">閉じる</button></div>
  <div class="dlg-body" id="dlgBody"></div></dialog>

<script>
// 見るだけ版（GitHub Pages）。data.json は手元のアプリが1日数回書き出している
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const WD = ["日","月","火","水","木","金","土"];
const store = { get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
let DATA = { accounts: [], shows: [] }, TAB = "upcoming", ACCT = store.get("acct"), PAST_YM = "";

const today = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; })();
const labelOf = (id) => (DATA.accounts.find(a => a.id === id) || {}).label || id;
function dparts(iso) { const [y, m, d] = iso.split("-").map(Number); return { y, m, d, w: new Date(y, m - 1, d).getDay() }; }

function chips(s) {
  const c = [];
  if (s.status === "canceled") c.push('<span class="chip cancel">中止</span>');
  if (s.type === "event") c.push('<span class="chip ev">イベント</span>');
  if (s.sale === "on" && s.date >= today) c.push('<span class="chip on">予約受付中</span>');
  if (s.sale === "before" && s.date >= today && (!s.sale_start || s.sale_start > today)) c.push(`<span class="chip">発売前${s.sale_start ? " " + s.sale_start.slice(5).replace("-", "/") + "〜" : ""}</span>`);
  if (s.sale === "soldout") c.push('<span class="chip">完売</span>');
  return c.join("");
}
const times = (s) => [s.open && "開場 " + s.open, s.start && "開演 " + s.start, s.stage && "出演 " + s.stage].filter(Boolean).join("　");

function card(s, i) {
  const p = dparts(s.date);
  const ticket = s.tickets[0] && s.date >= today ? `<a class="ticket" href="${esc(s.tickets[0])}" target="_blank" rel="noopener" onclick="event.stopPropagation()">チケット</a>` : "";
  return `<div class="card ${s.status === "canceled" ? "canceled" : ""}" data-i="${i}">
    <div class="date"><div class="md">${p.m}/${p.d}</div><div class="wd ${p.w === 6 ? "sat" : p.w === 0 ? "sun" : ""}">${WD[p.w]}${p.y !== new Date().getFullYear() ? "<br>" + p.y : ""}</div></div>
    <div class="body">${ACCT ? "" : `<div class="who">${esc(labelOf(s.account))}</div>`}
      <div class="title">${esc(s.title || (s.type === "event" ? "イベント" : "ライブ"))}</div>
      ${s.venue ? `<div class="line2">📍${esc(s.venue)}</div>` : ""}
      ${times(s) ? `<div class="line2">${esc(times(s))}</div>` : ""}
      <div class="chips">${ticket}${chips(s)}</div></div>
    ${s.thumb ? `<img class="thumb" loading="lazy" src="${esc(s.thumb)}" alt="">` : ""}
  </div>`;
}

function render() {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === TAB));
  const accts = DATA.accounts;
  $("accts").hidden = accts.length < 2;
  $("accts").innerHTML = [`<button data-acct="" class="${ACCT ? "" : "on"}">すべて</button>`]
    .concat(accts.map(a => `<button data-acct="${esc(a.id)}" class="${ACCT === a.id ? "on" : ""}">${esc(a.label)}</button>`)).join("");
  let list = DATA.shows.map((s, i) => ({ s, i })).filter(x => !ACCT || x.s.account === ACCT);
  list = TAB === "upcoming" ? list.filter(x => x.s.date >= today) : list.filter(x => x.s.date < today).reverse();
  let html = "", cur = "";
  if (TAB === "past" && list.length) {
    // 終了した公演は量が多いので、1か月ずつ表示する（新しい月から）
    const months = [...new Set(list.map(x => x.s.date.slice(0, 7)))];
    const counts = {};
    list.forEach(x => { const k = x.s.date.slice(0, 7); counts[k] = (counts[k] || 0) + 1; });
    if (!months.includes(PAST_YM)) PAST_YM = months[0];
    const k = months.indexOf(PAST_YM);
    const label = (ym) => { const [y, m] = ym.split("-"); return `${y}年${Number(m)}月（${counts[ym]}件）`; };
    html += `<div class="monthbar">
      <button data-ym="${months[k + 1] || ""}" ${months[k + 1] ? "" : "disabled"} aria-label="前の月">‹</button>
      <select id="ymSel" aria-label="表示する月">${months.map(m => `<option value="${m}" ${m === PAST_YM ? "selected" : ""}>${label(m)}</option>`).join("")}</select>
      <button data-ym="${months[k - 1] || ""}" ${k > 0 ? "" : "disabled"} aria-label="次の月">›</button></div>`;
    list = list.filter(x => x.s.date.slice(0, 7) === PAST_YM);
  }
  for (const { s, i } of list) {
    const ym = s.date.slice(0, 7);
    if (ym !== cur) { cur = ym; const [y, m] = ym.split("-"); html += `<div class="month">${y}年${Number(m)}月</div>`; }
    html += card(s, i);
  }
  if (!list.length) html = `<div class="empty">${TAB === "upcoming" ? "今後の公演はまだありません" : "ありません"}</div>`;
  const cals = accts.filter(a => (!ACCT || a.id === ACCT) && a.calendar && a.calendar.web);
  if (cals.length) {
    html += `<div class="cals"><h2>カレンダーに入れる</h2>${cals.map(a => `<div class="row"><b>${esc(a.label)}</b>
      <a class="btn sub" href="${esc(a.calendar.add)}" target="_blank" rel="noopener">Google カレンダーに追加</a>
      <a class="btn sub" href="${esc(a.calendar.web)}" target="_blank" rel="noopener">カレンダーで見る</a>
      <a class="btn sub" href="${esc(a.calendar.ical)}">iCal（iPhone など）</a></div>`).join("")}
      <div class="small">TimeTree を使っている人は、Google カレンダー（または iPhone のカレンダー）に追加してから、TimeTree アプリで外部カレンダーの表示をオンにしてください。</div></div>`;
  }
  $("main").innerHTML = html;
}

function openShow(i) {
  const s = DATA.shows[i];
  const p = dparts(s.date);
  $("dlgTitle").textContent = `${p.m}/${p.d}（${WD[p.w]}） ${s.title || ""}`;
  const rows = [["グループ", labelOf(s.account)], ["公演名", s.title], ["会場", s.venue], ["開場", s.open], ["開演", s.start], ["出演", s.stage],
    ["状態", s.status === "canceled" ? "中止" : ""]].filter(r => r[1]);
  $("dlgBody").innerHTML = `<dl>${rows.map(r => `<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl>
    <div class="chips">${s.tickets.map((u, k) => `<a class="ticket" href="${esc(u)}" target="_blank" rel="noopener">チケット${s.tickets.length > 1 ? k + 1 : ""}</a>`).join("")}
      ${s.post ? `<a class="btn sub" href="${esc(s.post)}" target="_blank" rel="noopener">元の告知（X）</a>` : ""}</div>
    ${s.image ? `<a href="${esc(s.post || s.image)}" target="_blank" rel="noopener"><img src="${esc(s.image)}" alt=""></a>` : ""}
    <p class="small">告知から自動で読み取っています。時間や内容は元の告知で確かめてください。</p>`;
  $("dlg").showModal();
}

document.addEventListener("click", (ev) => {
  const ym = ev.target.closest("[data-ym]");
  if (ym && ym.dataset.ym) { PAST_YM = ym.dataset.ym; render(); window.scrollTo(0, 0); return; }
  const t = ev.target.closest("[data-tab],[data-acct],[data-i]");
  if (!t) return;
  if (t.dataset.tab) { TAB = t.dataset.tab; render(); window.scrollTo(0, 0); }
  else if (t.dataset.acct !== undefined) { ACCT = t.dataset.acct; store.set("acct", ACCT); render(); }
  else if (t.dataset.i !== undefined) openShow(Number(t.dataset.i));
});
document.addEventListener("change", (ev) => {
  if (ev.target.id === "ymSel") { PAST_YM = ev.target.value; render(); window.scrollTo(0, 0); }
});
$("dlgClose").onclick = () => $("dlg").close();
$("dlg").addEventListener("click", (ev) => { if (ev.target === $("dlg")) $("dlg").close(); });

fetch("data.json", { cache: "no-store" }).then(r => r.json()).then(d => {
  DATA = d;
  if (ACCT && !DATA.accounts.some(a => a.id === ACCT)) ACCT = "";
  const up = DATA.shows.filter(s => s.date >= today).length;
  $("meta").textContent = `今後 ${up}件・更新 ${(d.updated || "").slice(5, 16).replace("T", " ").replace("-", "/")}`;
  render();
}).catch(e => { $("main").innerHTML = `<div class="empty">読み込めませんでした（${esc(e.message)}）</div>`; });
</script>
</body>
</html>
